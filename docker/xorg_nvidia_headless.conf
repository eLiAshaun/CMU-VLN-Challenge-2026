Section "ServerLayout"
    Identifier "layout"
    Screen 0 "screen0"
EndSection

Section "Files"
    ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Device"
    Identifier "device0"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "UseDisplayDevice" "None"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "device0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1920 640
    EndSubSection
EndSection
