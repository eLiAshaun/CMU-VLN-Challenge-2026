services:
  system:
    image: zhangjicmu/ubuntu24_ros:cmu_vla_challenge_simulation
    container_name: iros2026_system
    restart: "no"
    stop_grace_period: 30s
    privileged: true
    network_mode: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai_module:
    build:
      context: ../ai_module
      dockerfile: docker/Dockerfile
    image: docker_ai_module:mast3r-live
    container_name: iros2026_ai_module
    restart: "no"
    stop_grace_period: 30s
    runtime: nvidia
    network_mode: host
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - PYTHONPATH=/home/docker/ai_module
      - MAST3R_QWEN_QUANTIZATION=${MAST3R_QWEN_QUANTIZATION:-int8}
      - MAST3R_QWEN_MAX_PIXELS=${MAST3R_QWEN_MAX_PIXELS:-1048576}
    volumes:
      - ../ai_module/runs:/home/docker/ai_module/runs
    command: ["/home/docker/ai_module/docker/start_live_chain.sh"]
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
